[unix_http_server]
file=/root/apps/case-studio/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-fs/case-studio/logs/supervisord.log
pidfile=/root/apps/case-studio/run/supervisord.pid
childlogdir=/root/autodl-fs/case-studio/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/apps/case-studio/run/supervisor.sock

[program:case-studio]
directory=/root/apps/case-studio
command=/bin/bash /root/apps/case-studio/start.sh
environment=PYTHONUNBUFFERED="1",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",CASE_DATA="/root/autodl-fs/case-studio",STUDIO_REPO="/root/apps/case-studio",PORT="6008"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/root/autodl-fs/case-studio/logs/case-studio.log
stderr_logfile=/root/autodl-fs/case-studio/logs/case-studio-error.log
