[unix_http_server]
file=/root/apps/case-studio/run/supervisor.sock
chmod=0700
[supervisord]
logfile=/root/autodl-fs/case-studio/logs/supervisor.log
pidfile=/root/apps/case-studio/run/supervisord.pid
childlogdir=/root/autodl-fs/case-studio/logs
[supervisorctl]
serverurl=unix:///root/apps/case-studio/run/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[program:case-studio]
directory=/root/apps/case-studio
command=/root/apps/portrait-studio/.venv/bin/uvicorn app:app --host 0.0.0.0 --port 6008 --workers 1 --proxy-headers --forwarded-allow-ips=*
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="4",CASE_DATA="/root/autodl-fs/case-studio"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-fs/case-studio/logs/app.log
stderr_logfile=/root/autodl-fs/case-studio/logs/error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
