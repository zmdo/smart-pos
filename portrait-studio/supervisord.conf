[unix_http_server]
file=/root/apps/portrait-studio/run/supervisor.sock
chmod=0700
[supervisord]
logfile=/root/autodl-fs/portrait-studio/logs/supervisor.log
pidfile=/root/apps/portrait-studio/run/supervisord.pid
childlogdir=/root/autodl-fs/portrait-studio/logs
[supervisorctl]
serverurl=unix:///root/apps/portrait-studio/run/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[program:portrait-studio]
directory=/root/apps/portrait-studio
command=/root/apps/portrait-studio/.venv/bin/uvicorn app:app --host 0.0.0.0 --port 6006 --workers 1 --proxy-headers --forwarded-allow-ips=*
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="4",YOLO_CONFIG_DIR="/root/apps/portrait-studio/run/yolo"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-fs/portrait-studio/logs/app.log
stderr_logfile=/root/autodl-fs/portrait-studio/logs/error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3

